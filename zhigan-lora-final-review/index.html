:root{--bg:#f6f4ef;--panel:#fff;--line:#ddd9d0;--text:#171714;--muted:#77736b;--accent:#e34d32}

.toolbar{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:12px 24px;background:rgba(246,244,239,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.head{position:sticky;top:58px;z-index:10;background:#f1eee7;font-weight:650;padding:13px 10px;border-bottom:1px solid var(--line)}.cell{padding:10px;border-bottom:1px solid var(--line);min-width:0}.scene{font-size:12px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}.scene b{display:block;color:var(--text);font-size:13px;margin-bottom:5px}
.cell img{display:block;width:100%;height:auto;cursor:zoom-in}.empty{padding:60px;color:var(--muted)}
.filters{display:flex;gap:8px;padding:14px 24px;border-bottom:1px solid var(--line);background:#faf9f6}.filters.hidden{display:none}
.modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.92);align-items:center;justify-content:center}.modal.open{display:flex}.modal img{max-width:92vw;max-height:90vh;object-fit:contain}.close{position:absolute;right:20px;top:18px;color:#fff;font-size:28px;cursor:pointer}.nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;padding:20px;cursor:pointer}.prev{left:8px}.next{right:8px}

function imageCell(src){return `<div class="cell"><img src="${encodeURI(src)}" loading="lazy"></div>`}
function bindImages(){gallery=[...document.querySelectorAll('.view.active img')];gallery.forEach((img,i)=>img.onclick=()=>openModal(i))}
function renderFull(){const q=document.querySelector('#search').value.trim().toLowerCase();const rows=FULL.filter(x=>!q||x.case_id.includes(q)||x.filename.toLowerCase().includes(q));let h='<div class="head">SCENE</div>'+['original','realtime_online','realtime_lora','beauty_online','beauty_lora'].map(k=>`<div class="head">${labels[k]}</div>`).join('');rows.forEach((r,i)=>{h+=`<div class="cell scene"><b>${String(i+1).padStart(2,'0')}</b>${r.filename}</div>`;for(const k of ['original','realtime_online','realtime_lora','beauty_online','beauty_lora'])h+=imageCell(r.images[k])});document.querySelector('#fullGrid').innerHTML=h;bindImages()}
function renderSpecial(){const q=document.querySelector('#search').value.trim().toLowerCase();const rows=SPECIAL.filter(x=>x.dimension===dimension&&(!q||x.case_id.includes(q)||x.filename.toLowerCase().includes(q)));const keys=['original',`${chain}_online`,`${chain}_lora`];let h='<div class="head">SCENE</div>'+keys.map(k=>`<div class="head">${labels[k]}</div>`).join('');rows.forEach((r,i)=>{h+=`<div class="cell scene"><b>${String(i+1).padStart(2,'0')}</b>${r.filename}</div>`;for(const k of keys)h+=imageCell(r.images[k])});document.querySelector('#specialGrid').innerHTML=h;bindImages()}
document.querySelectorAll('.main-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.main-tab').forEach(x=>x.classList.toggle('active',x===b));currentView=b.dataset.view;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===currentView));document.querySelector('#specialtyFilters').classList.toggle('hidden',currentView!=='specialty');currentView==='full'?renderFull():renderSpecial()});
document.querySelectorAll('.chain').forEach(b=>b.onclick=()=>{chain=b.dataset.chain;document.querySelectorAll('.chain').forEach(x=>x.classList.toggle('active',x===b));renderSpecial()});
document.querySelectorAll('.dimension').forEach(b=>b.onclick=()=>{dimension=b.dataset.dimension;document.querySelectorAll('.dimension').forEach(x=>x.classList.toggle('active',x===b));renderSpecial()});
document.querySelector('#search').oninput=()=>currentView==='full'?renderFull():renderSpecial();
const modal=document.querySelector('#modal'),modalImg=modal.querySelector('img');function openModal(i){galleryIndex=i;modalImg.src=gallery[i].src;modal.classList.add('open')}function move(d){if(!gallery.length)return;galleryIndex=(galleryIndex+d+gallery.length)%gallery.length;modalImg.src=gallery[galleryIndex].src}modal.querySelector('.close').onclick=()=>modal.classList.remove('open');modal.querySelector('.prev').onclick=()=>move(-1);modal.querySelector('.next').onclick=()=>move(1);modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')modal.classList.remove('open')});
renderFull();
</script>
</body></html>
