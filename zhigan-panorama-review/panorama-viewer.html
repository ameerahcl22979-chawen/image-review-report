<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全景预览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1116;
      --panel: rgba(16, 20, 27, 0.82);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f3f5f7;
      --muted: #aeb6c2;
      --accent: #2aa198;
      --shadow: rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 Inter, "Microsoft YaHei", system-ui, sans-serif;
    }
    .viewer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #08090b;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      outline: none;
    }
    canvas:active { cursor: grabbing; }
    .topbar,
    .toolbar,
    .hud {
      position: absolute;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar {
      left: 14px;
      top: 14px;
      max-width: calc(100% - 28px);
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px var(--shadow);
    }
    .title {
      min-width: 0;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toolbar {
      top: 14px;
      right: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: calc(100% - 28px);
    }
    .hud {
      left: 14px;
      bottom: 14px;
      flex-wrap: wrap;
      max-width: calc(100% - 28px);
    }
    .panel {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 22px var(--shadow);
    }
    .hud .panel { color: #d7dde5; }
    .button {
      min-width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(20, 23, 27, 0.8);
      color: var(--text);
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 22px var(--shadow);
      backdrop-filter: blur(8px);
    }
    .button:hover { background: rgba(35, 40, 47, 0.94); }
    .button-icon { width: 14px; height: 14px; display: inline-flex; }
    .button-icon svg { width: 14px; height: 14px; display: block; }
    .view-input {
      width: 154px;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(20, 23, 27, 0.8);
      color: var(--text);
      outline: none;
      box-shadow: 0 8px 22px var(--shadow);
      backdrop-filter: blur(8px);
    }
    .view-input:focus { border-color: var(--accent); }
    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #909aa7;
      text-align: center;
      pointer-events: none;
    }
    .empty strong {
      display: block;
      color: #d6dbe3;
      margin-bottom: 6px;
      font-size: 16px;
    }
    @media (max-width: 860px) {
      .toolbar {
        top: auto;
        right: 14px;
        bottom: 68px;
      }
      .hud {
        bottom: 14px;
      }
      .topbar {
        max-width: calc(100% - 92px);
      }
    }
  </style>
</head>
<body>
  <main id="viewer" class="viewer">
    <div class="topbar">
      <div id="title" class="title">全景预览</div>
    </div>

    <div class="toolbar">
      <a id="openImageBtn" class="button" href="#" target="_blank" rel="noopener" title="打开原图">
        <span class="button-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3.5 12.5h9V6.75" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 3.5h5.5V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.5 3.5 6 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>原图</span>
      </a>
      <button id="zoomOutBtn" class="button" type="button" title="缩小">-</button>
      <button id="zoomInBtn" class="button" type="button" title="放大">+</button>
      <button id="resetBtn" class="button" type="button" title="重置视角">重置</button>
      <button id="fullBtn" class="button" type="button" title="全屏">全屏</button>
    </div>

    <div class="hud">
      <div id="metaStat" class="panel">-</div>
      <input id="viewInput" class="view-input" type="text" spellcheck="false" title="视角码：yaw,pitch,fov" />
      <button id="copyViewBtn" class="button" type="button" title="复制视角">复制视角</button>
      <button id="applyViewBtn" class="button" type="button" title="定位视角">定位</button>
    </div>

    <div id="empty" class="empty">
      <div>
        <strong>正在加载全景图</strong>
        拖拽旋转，滚轮缩放
      </div>
    </div>
  </main>

  <script src="./vendor-three.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sourceUrl = params.get('src') || params.get('url') || '';
    const titleText = params.get('title') || '全景预览';
    const DEFAULT_LON = Number(params.get('yaw') || 180);
    const DEFAULT_LAT = Number(params.get('pitch') || 0);
    const DEFAULT_FOV = Number(params.get('fov') || 100);

    const viewer = document.getElementById('viewer');
    const title = document.getElementById('title');
    const empty = document.getElementById('empty');
    const metaStat = document.getElementById('metaStat');
    const openImageBtn = document.getElementById('openImageBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const resetBtn = document.getElementById('resetBtn');
    const fullBtn = document.getElementById('fullBtn');
    const viewInput = document.getElementById('viewInput');
    const copyViewBtn = document.getElementById('copyViewBtn');
    const applyViewBtn = document.getElementById('applyViewBtn');

    title.textContent = titleText;
    document.title = `${titleText} - 全景预览`;
    const proxyUrl = sourceUrl || '';
    openImageBtn.href = proxyUrl || '#';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewer.appendChild(renderer.domElement);

    const geometry = new THREE.SphereGeometry(500, 96, 64);
    geometry.scale(-1, 1, 1);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    let currentTexture = null;
    let lon = 0;
    let lat = 0;
    let targetLon = 0;
    let targetLat = 0;
    let isPointerDown = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let lonStart = 0;
    let latStart = 0;
    let isEditingViewCode = false;

    function normalizeLon(value) {
      return ((((value + 180) % 360) + 360) % 360) - 180;
    }

    function viewCode() {
      return `${normalizeLon(targetLon).toFixed(1)},${targetLat.toFixed(1)},${Math.round(camera.fov)}`;
    }

    function updateViewInput() {
      if (!isEditingViewCode) viewInput.value = viewCode();
    }

    function parseViewCode(value) {
      const nums = value.match(/-?\d+(?:\.\d+)?/g);
      if (!nums || nums.length < 2) return null;
      const yaw = Number(nums[0]);
      const pitch = Number(nums[1]);
      const fov = nums.length >= 3 ? Number(nums[2]) : camera.fov;
      if (![yaw, pitch, fov].every(Number.isFinite)) return null;
      return {
        yaw: normalizeLon(yaw),
        pitch: THREE.MathUtils.clamp(pitch, -85, 85),
        fov: THREE.MathUtils.clamp(fov, 35, 100),
      };
    }

    function applyViewCode() {
      const parsed = parseViewCode(viewInput.value);
      if (!parsed) return;
      targetLon = parsed.yaw;
      targetLat = parsed.pitch;
      camera.fov = parsed.fov;
      camera.updateProjectionMatrix();
      isEditingViewCode = false;
      updateViewInput();
    }

    async function copyViewCode() {
      updateViewInput();
      viewInput.select();
      try {
        await navigator.clipboard.writeText(viewInput.value);
      } catch {
        document.execCommand('copy');
      }
    }

    function getImageName(src) {
      try {
        const url = new URL(src);
        const path = decodeURIComponent(url.pathname);
        return path.split('/').filter(Boolean).pop() || url.hostname;
      } catch {
        return src.split(/[\\/]/).pop() || '全景图';
      }
    }

    function resize() {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / Math.max(height, 1);
      camera.updateProjectionMatrix();
    }

    function animate() {
      requestAnimationFrame(animate);
      lon += (targetLon - lon) * 0.18;
      lat += (targetLat - lat) * 0.18;
      lat = Math.max(-85, Math.min(85, lat));
      const phi = THREE.MathUtils.degToRad(90 - lat);
      const theta = THREE.MathUtils.degToRad(lon);
      const x = 500 * Math.sin(phi) * Math.cos(theta);
      const y = 500 * Math.cos(phi);
      const z = 500 * Math.sin(phi) * Math.sin(theta);
      camera.lookAt(x, y, z);
      renderer.render(scene, camera);
    }

    function resetView() {
      lon = DEFAULT_LON;
      lat = DEFAULT_LAT;
      targetLon = DEFAULT_LON;
      targetLat = DEFAULT_LAT;
      camera.fov = DEFAULT_FOV;
      camera.updateProjectionMatrix();
      updateViewInput();
    }

    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('图片加载失败。'));
        image.src = src;
      });
    }

    async function loadPanorama(src) {
      if (!src) {
        empty.innerHTML = '<div><strong>没有可预览的图片</strong>请从对比页点击“全景预览”进入</div>';
        return;
      }
      const image = await loadImageElement(src);
      const texture = new THREE.Texture(image);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      texture.needsUpdate = true;

      if (currentTexture) currentTexture.dispose();
      currentTexture = texture;
      material.map = texture;
      material.needsUpdate = true;
      metaStat.textContent = `${getImageName(sourceUrl || src)} · ${image.naturalWidth || image.width} x ${image.naturalHeight || image.height}`;
      empty.style.display = 'none';
    }

    zoomInBtn.addEventListener('click', () => {
      camera.fov = Math.max(35, camera.fov - 8);
      camera.updateProjectionMatrix();
      updateViewInput();
    });

    zoomOutBtn.addEventListener('click', () => {
      camera.fov = Math.min(100, camera.fov + 8);
      camera.updateProjectionMatrix();
      updateViewInput();
    });

    resetBtn.addEventListener('click', resetView);
    fullBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) viewer.requestFullscreen?.();
      else document.exitFullscreen?.();
    });
    copyViewBtn.addEventListener('click', copyViewCode);
    applyViewBtn.addEventListener('click', applyViewCode);

    viewInput.addEventListener('focus', () => {
      isEditingViewCode = true;
      viewInput.select();
    });
    viewInput.addEventListener('blur', () => {
      isEditingViewCode = false;
      updateViewInput();
    });
    viewInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        applyViewCode();
        viewInput.blur();
      }
    });

    renderer.domElement.addEventListener('pointerdown', event => {
      isPointerDown = true;
      pointerStartX = event.clientX;
      pointerStartY = event.clientY;
      lonStart = targetLon;
      latStart = targetLat;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener('pointermove', event => {
      if (!isPointerDown) return;
      targetLon = lonStart - (event.clientX - pointerStartX) * 0.12;
      targetLat = latStart + (event.clientY - pointerStartY) * 0.12;
      targetLat = Math.max(-85, Math.min(85, targetLat));
      updateViewInput();
    });

    renderer.domElement.addEventListener('pointerup', event => {
      isPointerDown = false;
      renderer.domElement.releasePointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener('dblclick', resetView);
    renderer.domElement.addEventListener('wheel', event => {
      event.preventDefault();
      camera.fov = THREE.MathUtils.clamp(camera.fov + Math.sign(event.deltaY) * 4, 35, 100);
      camera.updateProjectionMatrix();
      updateViewInput();
    }, { passive: false });

    window.addEventListener('resize', resize);
    document.addEventListener('fullscreenchange', resize);

    resetView();
    resize();
    loadPanorama(proxyUrl).catch(() => {
      empty.innerHTML = '<div><strong>全景图加载失败</strong>请确认图片路径可访问</div>';
      metaStat.textContent = getImageName(sourceUrl || proxyUrl);
    });
    animate();
  </script>
</body>
</html>
